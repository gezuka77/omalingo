name: Build Oma Lingo Docker image

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the numbered release from VERSION
        type: boolean
        default: false

concurrency:
  group: omalingo-image-publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify source and tests
        run: |
          python3 scripts/check_public_source.py
          python3 scripts/build_frontend.py --check
          node --check app.js
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p '*_test.py'

      - name: Read version
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "Run the image build from the default branch." >&2
            exit 1
          fi
          version="$(cat VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must be in MAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          grep -Fq "## [$version]" CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build image
        env:
          IMAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omalingo-app"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=$IMAGE_VERSION" \
            --tag "$image:$GITHUB_SHA" --tag "$image:latest" .

      - name: Publish image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_VERSION: ${{ steps.release.outputs.version }}
          NUMBERED_RELEASE: ${{ inputs.release }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omalingo-app"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [[ "$NUMBERED_RELEASE" == "true" ]]; then
            tag="$image:v$IMAGE_VERSION"
            if inspect="$(docker buildx imagetools inspect "$tag" 2>&1)"; then
              echo "$tag already exists. Bump VERSION and update CHANGELOG.md." >&2
              exit 1
            elif [[ "$inspect" != *"not found"* && "$inspect" != *"manifest unknown"* && "$inspect" != *"no such manifest"* ]]; then
              printf '%s\n' "$inspect" >&2
              exit 1
            fi
          fi
          docker push "$image:$GITHUB_SHA"
          if [[ "$NUMBERED_RELEASE" == "true" ]]; then
            docker tag "$image:$GITHUB_SHA" "$tag"
            docker push "$tag"
          fi
          docker push "$image:latest"

      - name: Publish numbered GitHub release notes
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - <<'PYNOTES' > "$RUNNER_TEMP/release-notes.md"
          import os
          from pathlib import Path
          text = Path('CHANGELOG.md').read_text()
          version = os.environ['IMAGE_VERSION']
          section = text.split('## [' + version + ']', 1)[1].split('\n', 1)[1]
          print(section.split('\n## [', 1)[0].strip())
          PYNOTES
          python3 - <<'PYIMAGE' > "$RUNNER_TEMP/omalingo-image.json"
          import json, os, subprocess
          image = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY_OWNER'].lower() + '/omalingo-app'
          refs = json.loads(subprocess.check_output(['docker', 'image', 'inspect', image + ':' + os.environ['GITHUB_SHA'], '--format', '{{json .RepoDigests}}'], text=True))
          matches = [ref for ref in refs if ref.startswith(image + '@sha256:')]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one published image digest')
          print(json.dumps(dict(image=matches[0], revision=os.environ['GITHUB_SHA'], version=os.environ['IMAGE_VERSION'], run_id=int(os.environ['GITHUB_RUN_ID']))))
          PYIMAGE
          gh release create "v$IMAGE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Oma Lingo v$IMAGE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "$RUNNER_TEMP/omalingo-image.json"
